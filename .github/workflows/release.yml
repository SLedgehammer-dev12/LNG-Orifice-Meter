name: Sürüm Derleme ve Yayın

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testler (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Kaynak kodu
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Motor testleri
        run: python test_engine.py

  build:
    name: Derleme (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LNG-Orifice-Meter-windows-x64
            file: LNG-Orifice-Meter-windows-x64.exe
            display: "Windows x64"
            nuitka_extra: >-
              --onefile
              --windows-console-mode=disable
              --windows-company-name="SLedgehammer Engineering"
              --windows-product-name="LNG Orifice Meter"
              --windows-file-description="LNG Orifice Meter - ISO 5167-2 orifis boyutlandirma araci"
              --windows-file-version=1.0.0.0
              --windows-product-version=1.0.0
          - os: macos-14
            artifact: LNG-Orifice-Meter-macOS-arm64
            file: LNG-Orifice-Meter-macOS-arm64.zip
            display: "macOS Apple Silicon (arm64)"
            nuitka_extra: >-
              --macos-create-app-bundle
              --macos-app-mode=gui
              --macos-app-name="LNG-Orifice-Meter"
              --macos-app-version="1.0.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Kaynak kodu
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derleme bağımlılıkları (Nuitka)
        run: pip install -r requirements-build.txt
      - name: Nuitka ile doğal kod derleme (${{ matrix.display }})
        run: >-
          python -m nuitka --assume-yes-for-downloads
          --standalone
          --enable-plugin=tk-inter
          --output-dir=dist
          --output-filename="LNG-Orifice-Meter"
          ${{ matrix.nuitka_extra }}
          main.py
        shell: bash
      - name: Windows paketle (.exe)
        if: runner.os == 'Windows'
        working-directory: dist
        run: mv "LNG-Orifice-Meter.exe" LNG-Orifice-Meter-windows-x64.exe
      - name: macOS bundle meta verisi + ad-hoc imza + .app zip
        if: runner.os == 'macOS'
        working-directory: dist
        run: |
          rm -rf "LNG-Orifice-Meter.dist"
          mv "main.app" "LNG-Orifice-Meter.app"
          plutil -replace CFBundleShortVersionString -string "1.0.0" "LNG-Orifice-Meter.app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "1.0.0" "LNG-Orifice-Meter.app/Contents/Info.plist"
          plutil -replace CFBundleName -string "LNG Orifice Meter" "LNG-Orifice-Meter.app/Contents/Info.plist"
          plutil -insert NSHumanReadableCopyright -string "Copyright (c) 2026 SLedgehammer Engineering" "LNG-Orifice-Meter.app/Contents/Info.plist"
          codesign --force --deep --sign - "LNG-Orifice-Meter.app"
          zip -r LNG-Orifice-Meter-macOS-arm64.zip "LNG-Orifice-Meter.app"
          rm -rf "LNG-Orifice-Meter.app"
      - name: Derleme çıktısı
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.file }}

  release:
    name: GitHub Sürümü Oluştur
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Derlemeleri indir
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Paket listesi
        run: find artifacts -type f | sort
      - name: v1.0 Sürümünü yayınla
        uses: softprops/action-gh-release@v2
        with:
          name: LNG Orifice Meter ${{ github.ref_name }}
          body: |
            ## LNG Orifis Ölçüm Noktası Tasarım Aracı — ${{ github.ref_name }}

            **Çapraz platform yapılar (Nuitka — doğal makine kodu, bootloader yok):**
            - `LNG-Orifice-Meter-windows-x64.exe` — Windows 10/11 x64 (PE sürüm meta verisi dahil)
            - `LNG-Orifice-Meter-macOS-arm64.zip` — macOS Apple Silicon (M1 Pro / M1 / M2 …), ad-hoc imzalı .app

            **Güvenlik notu:** Yapılar PyInstaller yerine **Nuitka** ile derlenmiştir (kendi kendine açılan
            bootloader içermez; antivirüs yanlış pozitif olasılığını önemli ölçüde azaltır). Yine de imzasız
            indirme oldukları için bazı AV/Gatekeeper uyarıları oluşabilir — README'deki güvenlik bölümüne bakınız.

            **Kapsanan modeller:** Peng-Robinson EOS bubble point, Revised Klosek-Zander yoğunluk,
            ISO 5167-2 (tam Reader-Harris/Gallagher flange taps), Newton-Raphson boyutlandırma,
            flashing/kavitasyon + ASME B31.3 emniyet denetimi, N₂ duyarlılık analizi,
            HTML rapor ve JSON çıktısı.

            Detaylar: `README.md`
          files: artifacts/**
          draft: false
          prerelease: false